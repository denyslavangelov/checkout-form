# Fly.io config for ShipMatch (Shopify embedded app)
# App URL will be: https://shipmatch.fly.dev

app = 'shipmatch'
primary_region = 'fra'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  # SQLite on persistent volume (single-machine; fine for sessions)
  DATABASE_URL = 'file:/data/prod.sqlite'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/auth/login'

[[mounts]]
  source = 'shipmatch_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
